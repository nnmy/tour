<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soạn lịch trình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" data-lib="d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" data-lib="topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js" data-lib="mp4-muxer.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" data-lib="jszip.min.js"></script>
<style>
:root{
  --paper:#f3f4f1; --card:#ffffff; --ink:#1c2630; --muted:#6b757d; --faint:#9aa2a8; --line:#e2e5e1; --line2:#eef0ed;
  --accent:#27466f; --accent-soft:#e7edf5; --accent-ink:#ffffff;
  --red:#d0453b; --orange:#e3892f; --green:#3c9259; --blue:#3f7cb8;
  --radius:12px; --font:"Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.bar h1{font-size:18px;margin:0;letter-spacing:-.01em;font-weight:700;line-height:1.2}
.bar .sub{color:var(--muted);font-size:12.5px}
.bar .grow{flex:1}
.bar .actions{display:flex;gap:6px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:400px 1fr;min-height:0}
.side{overflow-y:auto;border-right:1px solid var(--line);background:var(--paper);min-height:0}
.mapwrap{position:relative;min-height:0;background:#dfe7eb;overflow:hidden}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.mapwrap canvas.card{cursor:grab} .mapwrap canvas.drag{cursor:grabbing} .mapwrap canvas.pt{cursor:pointer} .mapwrap canvas.place{cursor:crosshair}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#cdd2cd;background:#fafbf9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#1f3a5e}
.btn.ghost{background:none;border-color:transparent}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn.icon{padding:4px 7px;min-width:30px;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:12px;height:12px;fill:currentColor;flex:none}
/* Play is the one loud control on the map: vermilion against the navy switches */
.btn.play{background:#cf4219;border-color:#cf4219;color:#fff;font-weight:700;border-radius:999px;padding:6px 13px 6px 11px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 5px 16px rgba(207,66,25,.42)}
.btn.play:hover{background:#b5380f;border-color:#b5380f}
.btn.play:focus-visible{outline-color:#cf4219;outline-offset:3px}
.btn.sq{padding:6px 10px}
.mapwrap.playing .zoombox{display:none}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f>span{font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .x{border:0;background:none;padding:0 0 0 2px;color:inherit;opacity:.6}
.daychips{display:flex;gap:6px;overflow-x:auto;padding:12px 18px;border-bottom:1px solid var(--line)}
.daychip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;line-height:1.3}
.daychip b{font-size:13px}
.daychip[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.lvl{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.lvl.red{background:var(--red)} .lvl.orange{background:var(--orange)} .lvl.green{background:var(--green)} .lvl.blue{background:var(--blue)}
.note{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:6px 0}
.note .view{min-height:34px;padding:6px 9px;border:1px dashed transparent;border-radius:8px;cursor:text}
.note .view:hover{border-color:var(--line)}
.note .view:empty::before{content:"Nhập lưu ý (hỗ trợ HTML)…";color:var(--faint)}
.note select{width:auto;padding:4px 6px;font-size:12px}
.note textarea{width:100%;min-height:60px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.weather{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:end}
.weather>label:last-child{grid-column:1/-1}
.weather input,.weather select{width:100%}
/* timeline list */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:62px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl.v::before{left:98px}
.stop{position:relative;display:grid;grid-template-columns:44px 22px 1fr auto;gap:0 8px;align-items:center;padding:7px 0;border-radius:10px}
.stop .t{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;text-align:right;color:var(--ink);line-height:1.2}
.stop .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.stop .dot{width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent);z-index:1}
.stop .nm{min-width:0}
.stop .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .nm>span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .acts{display:flex;gap:2px}
.stop.rainy .dot{border-style:dashed}
.stop.v{grid-template-columns:22px 44px 22px 1fr auto}
.badge{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:8px;background:var(--line2);color:var(--muted);margin-left:4px;font-weight:500;vertical-align:1px}
.stop.done{opacity:.42}
.stop.del{opacity:.42} .stop.del .nm b{text-decoration:line-through}
.stop.now{background:var(--accent-soft)}
.stop.v{scroll-margin-top:12px}
.stop.now .dot{background:var(--accent);color:#fff}
.stop.off{opacity:.55}
/* editor list: ⋮⋮ handle, drag ghost and drop markers */
.tl.e::before{left:88px}
.stop.e{grid-template-columns:18px 44px 22px 1fr auto;user-select:none;-webkit-user-select:none}
.grip{width:18px;height:30px;border:0;background:none;padding:0;border-radius:6px;color:var(--faint);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;-webkit-touch-callout:none}
.grip:hover{color:var(--ink);background:var(--line2)}
.grip svg{width:8px;height:14px;fill:currentColor}
@media (pointer:fine){ .stop.e{cursor:grab} }
@media (pointer:coarse){ .grip{width:26px;height:36px} .stop.e{grid-template-columns:26px 44px 22px 1fr auto} .tl.e::before{left:96px} }
.stop.dragging{opacity:.35}
.stop.drop-before::after,.stop.drop-after::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;border-radius:2px;background:var(--accent)}
.stop.drop-after::after{top:auto;bottom:-1px}
.sec.dropzone{outline:2px dashed var(--accent);outline-offset:-6px;border-radius:12px}
.daychip.drop{outline:2px dashed var(--accent);outline-offset:2px}
.dragghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,calc(-100% - 14px));max-width:240px;padding:5px 11px;border-radius:9px;background:var(--card);border:1.5px solid var(--accent);color:var(--accent);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 22px rgba(10,20,30,.22)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
#paneDays>.daychips{position:sticky;top:var(--tabsH,41px);z-index:4;background:var(--paper)}
.dhrow{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.dhrow h3{margin:0;flex:1;min-width:0}
.dhrow select{font-size:12px;padding:3px 6px;max-width:160px}
.notice{margin:12px 18px 0;padding:10px 12px;border-radius:10px;background:#fdf0de;border:1px solid #efd3ab;font-size:12.5px;color:#5c3d12}
.notice p{margin:0 0 8px} .notice code{font-size:12px}
.status{width:22px;height:22px;border-radius:50%;border:1.5px solid #c3c9c4;background:var(--card);padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.status.done{background:var(--green);border-color:var(--green)}
.status.del{background:#8b9399;border-color:#8b9399}
.placechip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px dashed #b7c2cf;border-radius:10px;background:var(--card);cursor:grab;color:var(--accent);font-weight:600;user-select:none}
.placechip.on{background:var(--accent-soft);border-style:solid}
.mapbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mapbar .grow{flex:1;pointer-events:none}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 2px 10px rgba(20,30,40,.08)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.zoombox{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoombox .btn{box-shadow:0 2px 10px rgba(20,30,40,.08)}
.maphint{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--muted);max-width:60%}
.shadow{box-shadow:0 2px 10px rgba(20,30,40,.08)}
dialog{border:0;border-radius:16px;padding:0;max-width:min(620px,94vw);width:620px;box-shadow:0 30px 80px rgba(10,20,30,.3);color:var(--ink)}
dialog::backdrop{background:rgba(20,28,36,.45)}
dialog .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .dh h2{margin:0;font-size:16px;flex:1}
dialog .db{padding:14px 18px;max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
dialog .df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
dialog .df .grow{flex:1}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:12.5px;font-weight:600;padding:0 6px}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 9px;font-size:12.5px}
.modes button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs .th{position:relative;width:76px;height:58px;border-radius:8px;background:#ddd center/cover}
.thumbs .th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:11px;padding:0}
.costin{display:grid;grid-template-columns:1fr 90px;gap:6px}
.costin input{width:100%}
.inline{display:flex;align-items:center;gap:8px}
.est{margin:6px 0 2px;padding:8px 10px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12.5px}
.est table{width:100%;border-collapse:collapse}
.est td{padding:2px 0} .est td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dayhead{display:flex;align-items:baseline;gap:8px;padding:14px 18px 6px}
.dayhead h3{margin:0;font-size:15px;white-space:nowrap}
.dayhead .w{flex:1;min-width:0}
.dayhead .w{color:var(--muted);font-size:12.5px}

.daysec{border-bottom:1px solid var(--line);padding-bottom:10px}
.daysec .tl{padding:0 12px 0 6px}
.rich p{margin:.2em 0} .rich ul{margin:.2em 0;padding-left:1.2em}
.dayhead{align-items:center}
.dtog{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;text-align:left;font-size:13.5px;font-weight:600;color:var(--ink)}
.dtog .chev{width:12px;color:var(--muted);font-size:11px}
.dtog .nb{color:#fff;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:700}
.dtog .w{color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daysec.closed{padding-bottom:4px}
.daysec.closed .dayhead{padding-bottom:10px}
.stop.focus{background:var(--accent-soft)}
/* floating scroll buttons (phones: the map takes swipes, so these move the page) */
.scrollfab{position:fixed;right:0;top:calc(50% - 48px);z-index:40;display:flex;flex-direction:column;background:rgba(255,255,255,.95);border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;box-shadow:0 4px 14px rgba(20,30,40,.16);overflow:hidden;padding-right:env(safe-area-inset-right)}
.scrollfab[hidden]{display:none}
body.has-fab .side{padding-right:32px} /* a lane for the scroll buttons so they never cover row buttons */
.scrollfab button{width:32px;height:48px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.scrollfab button+button{border-top:1px solid var(--line)}
.scrollfab button:disabled{color:var(--faint);cursor:default}
.scrollfab button:focus-visible{outline-offset:-3px}
.scrollfab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* day reminders in the viewer: small type, can be folded away */
.notes{padding:0 18px 6px}
.ntog{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;font-size:11px;font-weight:600;color:var(--muted)}
.ntog:hover{color:var(--ink)}
.ntog .chev{width:9px;font-size:9px}
.ntog .ndots{display:inline-flex;gap:3px;margin-left:2px}
.ntog .ndots .lvl{width:7px;height:7px}
.notes-list{display:flex;flex-direction:column;gap:3px;padding:2px 0 0}
.notes-list .n{display:flex;gap:7px;align-items:baseline;font-size:10px;line-height:1.45}
.notes-list .n .lvl{width:8px;height:8px;transform:translateY(.5px)}
/* detail drawer */
.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:min(380px,calc(100% - 24px));background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(10,20,30,.25);display:flex;flex-direction:column;overflow:hidden;z-index:4}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:16px;margin:0;flex:1;line-height:1.3}
.drawer .db{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:85%;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}
.gallery img{width:100%;height:190px;object-fit:cover;border-radius:10px;scroll-snap-align:start;background:#eee}
.gallery.one{grid-auto-columns:100%}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.legbox{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px}
.info-box{padding:6px 18px 14px;font-size:13px}
.info-box table{border-collapse:collapse;width:100%;font-size:12.5px}
.info-box td{padding:4px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.pill{display:inline-block;padding:0 7px;border-radius:8px;font-size:11px;font-weight:600}
.pill.ok{background:#e3f1e7;color:#2b6d42} .pill.no{background:#fbe6e4;color:#a8352c} .pill.part{background:#fdf0de;color:#9a5b14}
.bk{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.bk>:nth-child(1){grid-column:1/3}.bk>:nth-child(2){grid-column:3}.bk>:nth-child(3){grid-column:1}.bk>:nth-child(4){grid-column:2/4}.bk>:nth-child(5){grid-column:1/-1}.bk>:nth-child(6){grid-column:1/-1}
.bk select,.bk input{width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:100;opacity:0;transition:opacity .2s}
.toast{pointer-events:none;max-width:calc(100vw - 24px)}
.toast.on{opacity:1;pointer-events:auto}
.toast .tbtn{margin-left:12px;background:none;border:0;padding:0;color:#a9c6ea;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
#printRoot{display:none}
@media (max-width:900px){
  .split{grid-template-columns:1fr;grid-template-rows:52vh auto}
  .split>.mapwrap{order:-1}
  .app{height:auto;min-height:100vh}
  .side{border-right:0;overflow:visible}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* ---------- print (PDF) ---------- */
@media print{
  @page{size:A4;margin:16mm 14mm}
  html,body{background:#fff!important;height:auto}
  .app,dialog,.toast,.scrollfab,.dragghost{display:none!important}
  #printRoot{display:block;color:#1c2630;font:10.5pt/1.5 var(--font)}
  .p-cover{border-bottom:1.5pt solid #1c2630;padding-bottom:10pt;margin-bottom:14pt}
  .p-cover h1{font-size:22pt;margin:0;letter-spacing:-.01em}
  .p-cover .meta{color:#555;margin-top:3pt}
  .p-sec{margin:0 0 12pt}
  .p-sec h2{font-size:11pt;margin:0 0 5pt;text-transform:none;color:#27466f}
  .p-tbl{width:100%;border-collapse:collapse;font-size:9.5pt}
  .p-tbl td,.p-tbl th{padding:3pt 4pt;border-bottom:.5pt solid #ddd;text-align:left;vertical-align:top}
  .p-tbl th{font-weight:600;color:#666;font-size:8.5pt}
  .p-day{break-before:page}
  .p-day h2{font-size:15pt;margin:0}
  .p-day .w{color:#555;margin:2pt 0 8pt}
  .p-map{width:100%;border-radius:6pt;margin:4pt 0 8pt;border:.5pt solid #ddd}
  .p-notes{margin:0 0 8pt;padding:0;list-style:none}
  .p-notes li{display:flex;gap:6pt;align-items:baseline;margin:1.5pt 0}
  .p-notes .lvl{width:7pt;height:7pt;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p-stop{display:grid;grid-template-columns:44pt 1fr 90pt;gap:2pt 8pt;padding:5pt 0;border-bottom:.5pt solid #e5e5e5;break-inside:avoid}
  .p-stop .tm{font-weight:700;font-variant-numeric:tabular-nums}
  .p-stop .tm small{display:block;font-weight:400;color:#777}
  .p-stop .nm b{font-size:11pt}
  .p-stop .nm div{color:#444}
  .p-stop .c{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .p-leg{grid-column:2/-1;color:#777;font-size:9pt}
  .p-total{text-align:right;margin-top:6pt;font-weight:600}
  .p-plan{font-size:8pt;color:#777;border:.5pt solid #bbb;border-radius:3pt;padding:0 3pt;margin-left:4pt}
}
</style>
</head>
<body>
<!-- ================= EDITOR ================= -->
<div class="app" id="editor" hidden>
  <header class="bar">
    <div><h1 id="eTitle">Chuyến đi</h1><div class="sub" id="eSub"></div></div>
    <span class="grow"></span>
    <div class="actions">
      <label class="btn" title="Mở bản chỉnh sửa (.zip) hoặc file lịch trình (.json)">Mở file<input type="file" id="importZip" accept=".zip,.json" hidden></label>
      <button class="btn" id="saveEdit" type="button" title="File zip để mở lại và chỉnh sửa tiếp">Lưu bản chỉnh sửa</button>
      <button class="btn" id="saveView" type="button" title="File zip chứa trang HTML và ảnh để xem lịch trình">Xuất bản xem</button>
      <button class="btn" id="ePdf" type="button">PDF</button>
      <button class="btn primary" id="preview" type="button">Xem trước</button>
    </div>
  </header>
  <div class="split">
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabTrip" aria-selected="false" type="button">Chuyến đi</button>
        <button role="tab" id="tabDays" aria-selected="true" type="button">Lịch trình</button>
        <span style="flex:1"></span>
        <button class="btn ghost small" id="newTrip" type="button" style="margin-bottom:6px">Chuyến mới</button>
      </div>
      <div id="paneTrip" hidden>
        <div class="sec">
          <label class="f"><span>Tên chuyến</span><input type="text" id="tName" placeholder="Ví dụ: Hokkaido mùa tuyết"></label>
          <div class="row2" style="margin-top:10px">
            <label class="f"><span>Ngày đi</span><input type="date" id="tStart"></label>
            <label class="f"><span>Ngày về</span><input type="date" id="tEnd"></label>
          </div>
        </div>
        <div class="sec">
          <h3>Người tham gia</h3>
          <div class="chips" id="tPeople"></div>
          <input type="text" id="tPeopleIn" placeholder="Nhập tên rồi nhấn Enter" style="margin-top:8px;width:100%">
        </div>
        <div class="sec">
          <h3>Loại tiền</h3>
          <div class="chips" id="tCur"></div>
          <p class="hint">Loại tiền chọn đầu tiên là mặc định khi nhập chi phí.</p>
        </div>
        <div class="sec">
          <h3>Đặt chỗ &amp; thanh toán</h3>
          <div id="tBook"></div>
          <button class="btn small" id="addBook" type="button">+ Thêm mục</button>
        </div>
        <div class="sec">
          <h3>Lưu ý chung</h3>
          <textarea id="tNotes" rows="5" style="width:100%" placeholder="Hỗ trợ HTML, ví dụ &lt;a href=&quot;…&quot;&gt;link&lt;/a&gt;"></textarea>
        </div>
      </div>
      <div id="paneDays">
        <div class="notice" id="eNotice" role="status" hidden></div>
        <div class="daychips" id="eDays"></div>
        <div id="eDay"></div>
      </div>
    </aside>
    <main class="mapwrap" id="eMap">
      <div class="maphint" id="eHint">Kéo ô “Thêm điểm đến” vào bản đồ, hoặc nhấp đúp lên bản đồ.</div>
      <div class="zoombox"><button class="btn icon" data-z="in" type="button" aria-label="Phóng to">+</button><button class="btn icon" data-z="out" type="button" aria-label="Thu nhỏ">−</button><button class="btn icon" data-z="fit" type="button" aria-label="Vừa khung" title="Vừa khung">⤢</button></div>
    </main>
  </div>
</div>

<!-- ================= VIEWER ================= -->
<div class="app" id="viewer" hidden>
  <header class="bar">
    <button class="btn" id="backEdit" type="button" hidden>← Chỉnh sửa</button>
    <div><h1 id="vTitle"></h1><div class="sub" id="vSub"></div></div>
    <span class="grow"></span>
    <div class="actions">
      <button class="btn" id="vInfoBtn" type="button" aria-expanded="false">Thông tin chuyến</button>
      <button class="btn" id="vPdf" type="button">PDF</button>
    </div>
  </header>
  <div class="split">
    <aside class="side">
      <div id="vInfo" class="sec" hidden></div>
      <div class="daychips" id="vDays"></div>
      <div id="vList"></div>
    </aside>
    <main class="mapwrap" id="vMap">
      <div class="zoombox"><button class="btn icon" data-z="in" type="button" aria-label="Phóng to">+</button><button class="btn icon" data-z="out" type="button" aria-label="Thu nhỏ">−</button><button class="btn icon" data-z="fit" type="button" aria-label="Vừa khung" title="Vừa khung">⤢</button></div>
      <div class="mapbar">
        <div class="seg" id="vShow" role="group" aria-label="Khi phát hiện">
          <button type="button" data-v="name" aria-pressed="false">Tên</button>
          <button type="button" data-v="full" aria-pressed="true">Chi tiết</button>
        </div>
        <div class="seg" id="vPlan" role="group" aria-label="Phương án" hidden>
          <button type="button" data-v="sunny" aria-pressed="true">☀ Trời đẹp</button>
          <button type="button" data-v="rainy" aria-pressed="false">☂ Trời xấu</button>
        </div>
        <span class="grow"></span>
        <button class="btn play" id="vPlay" type="button" title="Phát lịch trình trên bản đồ"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.3-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z"/></svg><span>Play</span></button>
        <button class="btn shadow sq" id="vStop" type="button" title="Dừng hẳn, quay về bản đồ" aria-label="Dừng hẳn, quay về bản đồ" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg></button>
        <button class="btn shadow" id="vMp4" type="button">Lưu MP4</button>
      </div>
      <div class="drawer" id="vDrawer" hidden></div>
    </main>
  </div>
</div>

<!-- stop dialog -->
<dialog id="stopDlg">
  <div class="dh"><h2 id="sdTitle">Điểm đến</h2><span class="hint" id="sdArea" style="margin:0"></span></div>
  <div class="db">
    <fieldset id="sdLeg">
      <legend>Di chuyển đến đây</legend>
      <div class="modes" id="sdModes"></div>
      <div class="row2">
        <label class="f"><span>Thời gian di chuyển (phút)</span><input type="number" id="sdLegMin" min="0" step="5"></label>
        <label class="f"><span>Chi phí di chuyển</span><span class="costin"><input type="text" id="sdLegCost" inputmode="decimal" placeholder="vd 750 hoặc 380-500"><select id="sdLegCur"></select></span></label>
      </div>
      <label class="f"><span>Link chỉ đường Google Maps</span><span class="inline"><input type="url" id="sdLegLink" placeholder="https://maps.app.goo.gl/…" style="flex:1"><button class="btn small" type="button" id="sdLegGen">Tạo từ tọa độ</button></span></label>
      <label class="f"><span>Ghi chú chỉ đường</span><textarea id="sdLegNote" rows="2" placeholder="Ví dụ: lên toa số 3, xuống ga Otaru cửa Bắc"></textarea></label>
    </fieldset>
    <fieldset>
      <legend>Điểm đến</legend>
      <label class="f"><span>Tên</span><input type="text" id="sdName" placeholder="Ví dụ: Kênh đào Otaru"></label>
      <div class="row3">
        <label class="f"><span id="sdTimeLbl">Giờ đến</span><input type="time" id="sdTime"></label>
        <label class="f"><span id="sdDurLbl">Ở lại (phút)</span><input type="number" id="sdDur" min="0" step="15"></label>
        <label class="f"><span>Phương án</span><select id="sdPlan"><option value="all">Cả hai</option><option value="sunny">☀ Trời đẹp</option><option value="rainy">☂ Trời xấu</option></select></label>
      </div>
      <label class="inline" style="font-size:13px"><input type="checkbox" id="sdFlex"> Thời gian ở lại linh hoạt</label>
      <label class="f"><span>Hoạt động</span><textarea id="sdAct" rows="2" placeholder="Ví dụ: dạo kênh, ăn hải sản ở chợ Sankaku"></textarea></label>
      <label class="f"><span>Chi phí dự kiến</span><span class="costin"><input type="text" id="sdCost" inputmode="decimal" placeholder="vd 1200 hoặc 2000-6500"><select id="sdCur"></select></span></label>
      <label class="f"><span>Link Google Maps</span><span class="inline"><input type="url" id="sdLink" placeholder="https://maps.app.goo.gl/…" style="flex:1"><button class="btn small" type="button" id="sdLinkGen">Tạo từ tọa độ</button></span></label>
      <label class="f"><span>Lưu ý</span><textarea id="sdNote" rows="2"></textarea></label>
      <div class="f"><span style="font-size:12.5px;color:var(--muted);font-weight:500">Ảnh minh họa</span>
        <div class="thumbs" id="sdImgs"></div>
        <label class="btn small" style="align-self:flex-start">Thêm ảnh<input type="file" id="sdImgIn" accept="image/*" multiple hidden></label>
      </div>
    </fieldset>
  </div>
  <div class="df">
    <button class="btn" id="sdDel" type="button" style="color:var(--red)">Xóa điểm</button>
    <span class="grow"></span>
    <button class="btn" id="sdCancel" type="button">Hủy</button>
    <button class="btn primary" id="sdOk" type="button">Lưu</button>
  </div>
</dialog>

<!-- mp4 dialog -->
<dialog id="mp4Dlg" style="width:440px">
  <div class="dh"><h2>Lưu video</h2></div>
  <div class="db">
    <label class="f"><span>Tên file</span><span class="inline"><input type="text" id="mName" style="flex:1" spellcheck="false"><span class="hint" id="mExt" style="margin:0">.mp4</span></span></label>
    <label class="f"><span>Khổ video</span><select id="mAspect"><option value="9:16">Dọc 9:16</option><option value="16:9">Ngang 16:9</option><option value="1:1">Vuông 1:1</option></select></label>
    <p class="hint" id="mInfo"></p>
    <div id="mProg" hidden><div class="prog"><i id="mBar"></i></div><p class="hint" id="mStat"></p></div>
  </div>
  <div class="df"><span class="grow"></span><button class="btn" id="mCancel" type="button">Hủy</button><button class="btn primary" id="mGo" type="button">Chọn nơi lưu &amp; xuất</button></div>
</dialog>

let ATLAS = null;
function adminItems(topo, key, nameOf){
  const geoms = topo.objects[key].geometries, fc = topojson.feature(topo, topo.objects[key]);
  const count=new Map(), owner=new Map();
  geoms.forEach((g,gi) => { const walk=a=>{ if (typeof a==='number'){ const k=a<0?~a:a; count.set(k,(count.get(k)||0)+1); if(!owner.has(k)) owner.set(k,gi); } else if (a) a.forEach(walk); }; walk(g.arcs); });
  const coast=geoms.map(()=>[]), inner=geoms.map(()=>[]);
  for (const [k,gi] of owner) (count.get(k)>1?inner:coast)[gi].push([k]);
  const ml = arcs => arcs.length ? topojson.feature(topo,{type:'MultiLineString',arcs}).geometry : null;
  return fc.features.map((f,i) => { const name=nameOf(geoms[i].properties); f.properties={name}; return mkItem(name, f, ml(coast[i]), ml(inner[i]), true); });
}
function mkItem(name, f, border, inner, admin){
  let cc=d3.geoCentroid(f), r=0; if (!isFinite(cc[0])) { cc=[0,0]; r=Math.PI; }
  else { const v=a=>{ if (typeof a[0]==='number') r=Math.max(r,d3.geoDistance(cc,a)); else a.forEach(v); }; if (f.geometry) v(f.geometry.coordinates); }
  return { name, f, border, inner, cc, r:r+0.01, admin };
}
function buildAtlas(worldTopo){
  const geoms = worldTopo.objects.countries.geometries, fc = topojson.feature(worldTopo, worldTopo.objects.countries);
  const own=new Map(); geoms.forEach((g,gi)=>{ const walk=a=>{ if (typeof a==='number'){ const k=a<0?~a:a; if(!own.has(k)) own.set(k,gi); } else if (a) a.forEach(walk); }; walk(g.arcs); });
  const owned=geoms.map(()=>[]); for (const [k,gi] of own) owned[gi].push([k]);
  const inArch = ring => ARCH.some(({box:b}) => ring.every(([x,y]) => x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3]));
  const items=[];
  fc.features.forEach((f,i) => {
    const name=f.properties.name||('id'+f.id); if (name==='Japan'||name==='Vietnam') return;
    if (f.geometry && f.geometry.type==='MultiPolygon') f.geometry.coordinates = f.geometry.coordinates.filter(p => !inArch(p[0]));
    let border = owned[i].length ? topojson.feature(worldTopo,{type:'MultiLineString',arcs:owned[i]}).geometry : null;
    if (border) border = { type:'MultiLineString', coordinates: border.coordinates.filter(l => !inArch(l)) };
    f.properties={name}; items.push(mkItem(name, f, border, null, false));
  });
  const jp = adminItems(JSON.parse($('#geo-jp').textContent), 'japan', p => `${p.en} (${p.ja})`);
  const vn = adminItems(JSON.parse($('#geo-vn').textContent), 'vn', p => p.n);
  const all = jp.concat(vn, items);
  return { items:all, byName:new Map(all.map(it=>[it.name,it])) };
}
const areaCache = new Map();
function areaOf(s){
  if (!ATLAS) return '';
  const key=s.lat+','+s.lon; if (areaCache.has(key)) return areaCache.get(key);
  const pt=ll(s); let found='';
  const tryAt = q => { for (const it of ATLAS.items) if (d3.geoDistance(q,it.cc) < it.r && d3.geoContains(it.f, q)) return it.name; return ''; };
  found = tryAt(pt);
  if (!found) for (const r of [0.02,0.05,0.1,0.2]) { for (let a=0;a<360&&!found;a+=45) found=tryAt([pt[0]+r*Math.cos(a*Math.PI/180), pt[1]+r*Math.sin(a*Math.PI/180)]); if (found) break; }
  if (!found) for (const a of ARCH) for (const g of a.islets) if (d3.geoDistance(pt,g) < 0.004) found = a.prov;
  areaCache.set(key, found); return found;
}

/* ============================================================ projection */
const scaleForKm = (km, w) => w / (km / R_EARTH);
function makeProj(c, s, W, H){
  return d3.geoOrthographic().rotate([-c[0], -c[1]]).clipAngle(90).scale(s).translate([W/2, H/2]).precision(0).clipExtent([[-50,-50],[W+50,H+50]]);
}
function fitView(points, W, H, pad=0.16, minKm=3){
  if (!points.length) return { c:[136,36], s:scaleForKm(2600, Math.min(W,H)) };
  if (points.length===1) return { c:ll(points[0]), s:scaleForKm(Math.max(minKm, 12), Math.min(W,H)) };
  const mp={type:'MultiPoint',coordinates:points.map(ll)}; let c=d3.geoCentroid(mp);
  const unit = cc => d3.geoOrthographic().rotate([-cc[0],-cc[1]]).scale(1000).translate([0,0]);
  let b=d3.geoPath(unit(c)).bounds(mp); const m=unit(c).invert([(b[0][0]+b[1][0])/2,(b[0][1]+b[1][1])/2]); if (m && isFinite(m[0])){ c=m; b=d3.geoPath(unit(c)).bounds(mp); }
  const bw=Math.max(b[1][0]-b[0][0],1e-3), bh=Math.max(b[1][1]-b[0][1],1e-3);
  const s=1000*Math.min(W*(1-2*pad)/bw, H*(1-2*pad)/bh);
  return { c, s: clamp(s, Math.min(W,H)*0.4, scaleForKm(minKm, Math.min(W,H))) };
}

/* ============================================================ drawing */
const MAPC = { bg:'#dfe7eb', ocean:'#d5e3ea', land:'#fbfaf6', border:'#9fb0ad', inner:'#cfd8d4', hl:'#27466f' };
function isletPath(ctx, pr, c, s, u){
  const r = Math.max(s*2.5/R_EARTH, 1.6*u);
  for (const a of ARCH) for (const g of a.islets){ if (d3.geoDistance(g,c) > Math.PI/2) continue; const p=pr(g); if (!p) continue; ctx.moveTo(p[0]+r,p[1]); ctx.arc(p[0],p[1],r,0,Math.PI*2); }
}
function drawBase(ctx, pr, W, H, u, areas){
  const s=pr.scale(), c=[-pr.rotate()[0], -pr.rotate()[1]], path=d3.geoPath(pr, ctx);
  ctx.fillStyle=MAPC.bg; ctx.fillRect(0,0,W,H);
  const [tx,ty]=pr.translate(), far=Math.max(Math.hypot(tx,ty), Math.hypot(W-tx,ty), Math.hypot(tx,H-ty), Math.hypot(W-tx,H-ty));
  ctx.beginPath(); ctx.arc(tx,ty,s,0,Math.PI*2); ctx.fillStyle=MAPC.ocean; ctx.fill();
  if (!ATLAS) return;
  const rho = (far/s >= 1 ? Math.PI/2 : Math.asin(far/s)) + 0.03;
  const vis = ATLAS.items.filter(it => d3.geoDistance(c, it.cc) < rho + it.r);
  ctx.beginPath(); for (const it of vis) path(it.f); isletPath(ctx, pr, c, s, u); ctx.fillStyle=MAPC.land; ctx.fill();
  if (areas) for (const [name,a] of areas){ const it=ATLAS.byName.get(name); if (!it || a<0.01) continue; ctx.beginPath(); path(it.f); ctx.fillStyle=rgba(MAPC.hl, 0.035*a); ctx.fill(); }
  ctx.lineJoin='round';
  ctx.beginPath(); for (const it of vis) if (it.inner) path(it.inner); ctx.strokeStyle=MAPC.inner; ctx.lineWidth=0.8*u; ctx.stroke();
  ctx.beginPath(); for (const it of vis) if (it.border) path(it.border); ctx.strokeStyle=MAPC.border; ctx.lineWidth=0.9*u; ctx.stroke();
  ctx.beginPath(); isletPath(ctx, pr, c, s, u); ctx.lineWidth=0.6*u; ctx.stroke();
  if (areas) for (const [name,a] of areas){ const it=ATLAS.byName.get(name); if (!it || a<0.01) continue; ctx.beginPath(); path(it.f); ctx.strokeStyle=rgba(MAPC.hl, 0.28*a); ctx.lineWidth=1.2*u; ctx.stroke(); }
}
function routePts(a, b, pr, c, mode, uEnd=1){

    const cx=(P[0]+Q[0])/2+nx*L*0.22, cy=(P[1]+Q[1])/2+ny*L*0.22, pts=[];
    for (let i=0;i<=N;i++){ const t=uEnd*i/N, m=1-t; pts.push([m*m*P[0]+2*m*t*cx+t*t*Q[0], m*m*P[1]+2*m*t*cy+t*t*Q[1]]); }

const lighten = (h, f) => { const [r,g,b]=hexRgb(h); const m=v=>Math.round(v+(255-v)*f); return `rgb(${m(r)},${m(g)},${m(b)})`; };

  ctx.save(); ctx.globalAlpha=alpha*(strong?0.85:0.5); ctx.strokeStyle=lighten(color, strong?0.12:0.32); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=(mode==='walk'?3.2:2.6)*u; ctx.setLineDash(m.dash.map(v=>v*u)); if (t) ctx.lineDashOffset=-t*24*u;
  for (const pts of subs){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke(); }

}
const FONT = (w, px) => `${w} ${px}px "Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif`;
const EMOJI = px => `${px}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
function drawPin(ctx, x, y, num, color, u, o={}){

  if (o.ring){ ctx.beginPath(); ctx.arc(x,y,r+6*u,0,Math.PI*2); ctx.strokeStyle=rgba(color,0.35); ctx.lineWidth=4*u; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle = o.filled ? color : '#fff'; ctx.fill();
  ctx.lineWidth=2.2*u; ctx.strokeStyle=color; if (o.dashed) ctx.setLineDash([3*u,2.5*u]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = o.filled ? '#fff' : color; ctx.font=FONT(700, (o.big?12:11)*u); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(num), x, y+0.5*u);

  ctx.restore();
}

const PLANE = (() => { const top=[[1,0],[0.9,-0.06],[0.62,-0.09],[0.18,-0.09],[-0.22,-0.78],[-0.38,-0.78],[-0.16,-0.09],[-0.62,-0.09],[-0.8,-0.34],[-0.92,-0.34],[-0.84,-0.05],[-0.9,0]]; const pts=top.concat(top.slice(1,-1).reverse().map(([x,y])=>[x,-y])); const p=new Path2D(); pts.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y)); p.closePath(); return p; })();
const PIX = { frames:[
  ['.......HH.......','.....HHHHHH.....','..hhhhhhhhhhhh..','......SSSS......','......SSES......','......SSSS......','.......SS.......','.....BJJJJ......','....BBJJJJS.....','....BbJJJJ......','.....Bjjjj......','......PPPP......','......P..P......','.....P....P.....','.....P....P.....','....FF....FF....'],
  ['.......HH.......','.....HHHHHH.....','..hhhhhhhhhhhh..','......SSSS......','......SSES......','......SSSS......','.......SS.......','.....BJJJJ......','....BBJJJJ......','....BbJJJJS.....','.....Bjjjj......','......PPPP......','.......PP.......','.......PP.......','.......PP.......','......FFFF......']],
  pal:{ H:'#f4e9c2', h:'#cdbb84', S:'#f3c9a0', E:'#2a1b12', B:'#8a6340', b:'#c99a52', P:'#1c1c21', F:'#5a3d28', J:'#f6f4ee', j:'#c9c5bc' }, cache:[] };

function drawSubject(ctx, x, y, ang, mode, u, t){
  const sz=30*u; ctx.save(); ctx.translate(x,y);
  if (mode==='walk'){
    const st=Math.floor(t*5)%2, px=sz/12; ctx.scale(Math.cos(ang)<0?-1:1,1); ctx.imageSmoothingEnabled=false;
    ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=4*u; ctx.drawImage(pixSprite(st), -9*px, -17*px-(st?px*0.6:0), 18*px, 18*px);

function wrapLines(ctx, text, maxW, maxLines=99){
  const out=[];

    const toks = para.match(/[\u3000-\u9fff\uff00-\uffef]|[^\s\u3000-\u9fff\uff00-\uffef]+\s*|\s+/g) || [];
    let line='';
    for (let tk of toks){
      const test=line+tk;
      if (ctx.measureText(test.trimEnd()).width > maxW && line){ out.push(line.trimEnd()); line=tk.trimStart(); }
      else line=test;
      while (ctx.measureText(line.trimEnd()).width > maxW && line.length>1){ let k=line.length-1; while (k>1 && ctx.measureText(line.slice(0,k)).width>maxW) k--; out.push(line.slice(0,k)); line=line.slice(k); }

/* ============================================================ interactive map view */
class MapView {
  constructor(host, opts){
    this.host=host; this.opts=opts; this.cv=document.createElement('canvas'); host.prepend(this.cv); this.ctx=this.cv.getContext('2d');
    this.view=null; this.hits=[]; this.ptr=new Map(); this.drag=null; this.player=null; this.placing=false; this.W=1; this.H=1;
    new ResizeObserver(()=>this.resize()).observe(host);
    const cv=this.cv;
    cv.addEventListener('pointerdown', e=>this.down(e)); cv.addEventListener('pointermove', e=>this.move(e));
    cv.addEventListener('pointerup', e=>this.up(e)); cv.addEventListener('pointercancel', e=>this.up(e));
    cv.addEventListener('wheel', e=>{ if (this.player) return; e.preventDefault(); this.zoomAt(this.pos(e), Math.exp(-e.deltaY*0.0015)); }, {passive:false});
    cv.addEventListener('dblclick', e=>{ if (this.player || !opts.onDbl) return; const g=this.geo(this.pos(e)); if (g && this.hit(this.pos(e))<0) opts.onDbl(g[1], g[0]); });
    cv.addEventListener('dragover', e=>{ if (opts.onDrop){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; } });
    cv.addEventListener('drop', e=>{ if (!opts.onDrop) return; e.preventDefault(); const g=this.geo(this.pos(e)); if (g) opts.onDrop(g[1], g[0]); });
    $$('[data-z]', host).forEach(b => b.onclick = () => { if (this.player) return; const z=b.dataset.z; if (z==='fit') this.fit(); else this.zoomAt([this.W/2,this.H/2], z==='in'?1.6:1/1.6); });
  }
  resize(){ const r=this.host.getBoundingClientRect(); this.W=Math.max(1,r.width); this.H=Math.max(1,r.height); const d=window.devicePixelRatio||1; this.cv.width=Math.round(this.W*d); this.cv.height=Math.round(this.H*d); if (this.player && this.player.reframe) this.player.reframe(this.W, this.H); if (!this.view) this.fit(); this.draw(); }
  fit(){ const pts=this.opts.fitPoints ? this.opts.fitPoints() : []; const v=fitView(pts, this.W, this.H, 0.14, 2); this.view={c:[...v.c], s:v.s}; this.draw(); }
  proj(){ return makeProj(this.view.c, this.view.s, this.W, this.H); }
  pos(e){ const r=this.cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  geo(p){ if (!this.view) return null; const g=this.proj().invert(p); return g && isFinite(g[0]) ? g : null; }
  hit(p){ for (let i=this.hits.length-1;i>=0;i--){ const h=this.hits[i]; if (Math.hypot(h.x-p[0],h.y-p[1]) < 16) return i; } return -1; }
  onCard(p){ const r=this.player && this.player.cardRect; return !!r && p[0]>=r.x && p[0]<=r.x+r.w && p[1]>=r.y && p[1]<=r.y+r.h; }
  hitLabel(p){ if (!this.opts.onLabel) return -1; for (let i=this.hits.length-1;i>=0;i--){ const b=this.hits[i].lb; if (b && p[0]>=b[0] && p[0]<=b[2] && p[1]>=b[1] && p[1]<=b[3]) return i; } return -1; }
  draw(){ if (this._q) return; this._q=requestAnimationFrame(()=>{ this._q=null; this.render(); }); }
  render(){
    const d=window.devicePixelRatio||1, ctx=this.ctx; ctx.setTransform(d,0,0,d,0,0);
    if (this.player){ this.player.render(ctx, this.W, this.H, this.player.t, 1); return; }

    for (const op of tries){ const l=cardLayout(ctx, C, u, op); if (l.h<=room){ L=l; break; } if (!L || l.h<L.h) L=l; }

    if (free){ cx=clamp(free.x*W-cw/2, B.l, B.r-cw); cy=clamp(free.y*H-h/2, B.t, B.b-h); }
    else { cx=clamp(x-cw/2, A.l, A.r-cw); cy=Math.max(A.t, y-off-h); }

}
function drawIntro(ctx, W, H, sg, t, u, A){
  const p=t-sg.t0, d=sg.t1-sg.t0, a=Math.min(smooth(0,0.45,p), 1-smooth(d-0.6,d,p)); if (a<=0.01) return;
  const day=sg.day, idx=TRIP.days.indexOf(day)+1, maxW=Math.min(W-40*u, 380*u), pad=18*u;
  ctx.save(); ctx.globalAlpha=a;
  ctx.fillStyle=`rgba(243,244,241,${0.55*a})`; ctx.fillRect(0,0,W,H);
  const wt=weatherText(day.weather), top=A ? 10*u : 0, bot=A ? A.b : H;
  let nl, h;
  for (let k=3;k>=1;k--){ // on a small map, notes get fewer lines so the card stays above the buttons
    ctx.font=FONT(400,12.5*u); nl=sg.notes.map(n=>({lv:n.level, lines:wrapLines(ctx, plainText(n.html), maxW-2*pad-18*u, k)}));
    h = pad + 16*u + 26*u + (wt?20*u:0) + (nl.length? 10*u + nl.reduce((s,n)=>s+n.lines.length*17*u+6*u,0) : 0) + pad;
    if (!A || h<=bot-top) break;
  }
  const x=(W-maxW)/2, y=(A ? Math.max(top, (top+bot-h)/2) : (H-h)/2) - (1-a)*10*u;
  ctx.save(); ctx.shadowColor='rgba(15,25,35,.2)'; ctx.shadowBlur=26*u; ctx.shadowOffsetY=8*u; rrect(ctx,x,y,maxW,h,16*u); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
  let yy=y+pad; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font=FONT(600,12*u); ctx.fillStyle=sg.color; ctx.fillText(`Ngày ${idx}`, x+pad, yy); yy+=16*u;
  ctx.font=FONT(700,20*u); ctx.fillStyle='#1c2630'; ctx.fillText(fmtDayLong(day.date), x+pad, yy); yy+=26*u;
  if (wt){ ctx.font=FONT(400,12.5*u); ctx.fillStyle='#6b757d'; ctx.fillText(wt, x+pad, yy); yy+=20*u; }
  if (nl.length){ yy+=10*u; for (const n of nl){ ctx.beginPath(); ctx.arc(x+pad+5*u, yy+8*u, 4.5*u, 0, Math.PI*2); ctx.fillStyle=n.lv==='red'?'#d0453b':'#e3892f'; ctx.fill(); ctx.font=FONT(n.lv==='red'?600:400,12.5*u); ctx.fillStyle='#1c2630'; for (const l of n.lines){ ctx.fillText(l, x+pad+18*u, yy); yy+=17*u; } yy+=6*u; } }
  ctx.restore();
}

/* ---- moving stops and swapping days ---- */
const GRIP_SVG = '<svg viewBox="0 0 10 16" aria-hidden="true"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg>';
const dayOfStop = s => TRIP.days.find(d=>d.stops.includes(s));
// Undo restores the days as they were, as long as nothing else was edited in between.
function offerUndo(msg, snap){
  const v=EDITVER;
  toast(msg, 6500, { label:'Hoàn tác', fn:()=>{
    if (EDITVER!==v){ toast('Lịch trình đã thay đổi sau đó nên không hoàn tác được nữa.'); return; }
    TRIP.days=JSON.parse(snap); SELD=clamp(SELD,0,TRIP.days.length-1); changed(true); renderDayChips(); fitDay(); toast('Đã hoàn tác');
  } });
}
// Put stop s in day `to` before the stop now at index idx (idx = length: at the end). A moved stop keeps its duration,
// but its arrival time no longer holds, so it becomes unknown.
function moveStop(s, to, idx, o={}){
  const from=dayOfStop(s); if (!from || !to) return;
  const fi=from.stops.indexOf(s); let ti=clamp(idx, 0, to.stops.length);
  if (from===to){ if (ti>fi) ti--; if (ti===fi) return; }
  const snap=JSON.stringify(TRIP.days);
  from.stops.splice(fi,1); to.stops.splice(ti,0,s); s.time='';
  const di=TRIP.days.indexOf(to); if (o.follow) SELD=di;
  changed(true); renderDayChips(); if (o.follow) fitDay();
  const name=s.name||'điểm đến';
  offerUndo(from===to ? `Đã chuyển “${name}” tới vị trí ${ti+1}, giờ đến để trống.` : `Đã chuyển “${name}” sang Ngày ${di+1}, giờ đến để trống.`, snap);

/* Drag with pointer events rather than HTML drag-and-drop, so a finger on the ⋮⋮ handle works as well as a mouse.
   A stop can go to another position, onto a day chip (end of that day), or, after resting on a chip for a moment,
   into that day's list at a chosen position. A day chip dropped on another chip swaps the two days. */
const SPRING_MS = 600;
let DRAG = null;
function dragStart(e, kind, item, src, label){
  if (DRAG) return;
  DRAG={ kind, item, src, label, id:e.pointerId, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, tol:e.pointerType==='touch'?6:4, on:false, target:null, hover:-1, hoverT:0, raf:0 };

}
function dragMove(e){
  const D=DRAG; if (!D || e.pointerId!==D.id || D.dead) return; D.x=e.clientX; D.y=e.clientY;
  if (!D.on){
    if (Math.hypot(D.x-D.x0, D.y-D.y0) < D.tol) return;
    D.on=true; D.ghost=el('div','dragghost', esc(D.label)); document.body.appendChild(D.ghost); document.body.classList.add('dragging'); D.src.classList.add('dragging');
    const tick=()=>{ if (DRAG!==D || D.dead) return; dragTick(D); D.raf=requestAnimationFrame(tick); }; D.raf=requestAnimationFrame(tick);
  }
  e.preventDefault(); const gw=D.ghost.offsetWidth/2+8; D.ghost.style.left=clamp(D.x, gw, Math.max(gw, innerWidth-gw))+'px'; D.ghost.style.top=D.y+'px'; dragAim(D);
}
function dragClear(){ $$('#editor .drop-before, #editor .drop-after, #editor .dropzone, #editor .daychip.drop').forEach(x=>x.classList.remove('drop-before','drop-after','dropzone','drop')); }
function dragAim(D){
  dragClear(); D.target=null;
  const hit=document.elementFromPoint(D.x, D.y), chip=hit && hit.closest('#eDays .daychip');
  if (chip){
    const di=+chip.dataset.i; if (D.hover!==di){ D.hover=di; D.hoverT=performance.now(); }
    if (D.kind==='day'){ if (di!==D.item){ D.target={ type:'swap', di }; chip.classList.add('drop'); } }
    else if (TRIP.days[di]!==dayOfStop(D.item)){ D.target={ type:'end', di }; chip.classList.add('drop'); }
    return;
  }
  D.hover=-1;
  if (D.kind!=='stop') return;
  const zone=hit && hit.closest('#eStops'); if (!zone) return;
  const rows=$$('#eStops .stop'); let idx=rows.length;
  for (let k=0;k<rows.length;k++){ const r=rows[k].getBoundingClientRect(); if (D.y < r.top+r.height/2){ idx=k; break; } }
  const day=curDay(); if (day===dayOfStop(D.item)){ const fi=day.stops.indexOf(D.item); if (idx===fi || idx===fi+1) return; } // would land where it already is
  D.target={ type:'pos', di:SELD, idx };
  if (!rows.length) zone.classList.add('dropzone'); else if (idx<rows.length) rows[idx].classList.add('drop-before'); else rows[rows.length-1].classList.add('drop-after');
}
function dragTick(D){

  const side=$('#editor .side'), own=getComputedStyle(side).overflowY!=='visible';

  const top=Math.max(box.top, $('#eDays').getBoundingClientRect().bottom), E=44;
  let v=0; if (D.y>top && D.y<top+E) v=-(1-(D.y-top)/E); else if (D.y>box.bottom-E && D.y<box.bottom+20) v=Math.min(1, 1-(box.bottom-D.y)/E);

}
function dragEnd(){
  const D=DRAG; if (!D) return; DRAG=null; cancelAnimationFrame(D.raf);

  if (D.ghost) D.ghost.remove(); document.body.classList.remove('dragging'); $$('#editor .stop.dragging').forEach(x=>x.classList.remove('dragging')); D.src.classList.remove('dragging'); dragClear();
}
function swallowClick(){ const f=e=>{ e.stopPropagation(); e.preventDefault(); }; addEventListener('click', f, true); setTimeout(()=>removeEventListener('click', f, true), 0); }
function dragUp(e){

function dragCancel(e){ if (DRAG && e.pointerId===DRAG.id) dragEnd(); }
function dragKey(e){ // Esc drops nothing; the pointer-up that follows is swallowed

  D.dead=true; cancelAnimationFrame(D.raf); if (D.ghost) D.ghost.remove(); document.body.classList.remove('dragging'); $$('#editor .stop.dragging').forEach(x=>x.classList.remove('dragging')); dragClear();
}
async function fetchWeather(d){
  const i=TRIP.days.indexOf(d);
  const ref = d.stops[0] || TRIP.days.slice(0,i).reverse().flatMap(x=>x.stops).at(-1) || TRIP.days.flatMap(x=>x.stops)[0];
  if (!ref){ toast('Hãy đặt ít nhất một điểm đến để biết vị trí cần dự báo.'); return; }
  const q=`latitude=${ref.lat}&longitude=${ref.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto`;
  const set=(js, src)=>{ const k=js.daily; d.weather.cond=wmoToCond(k.weather_code[0], k.wind_speed_10m_max ? k.wind_speed_10m_max[0] : 0); d.weather.tmin=Math.round(k.temperature_2m_min[0]); d.weather.tmax=Math.round(k.temperature_2m_max[0]);
    if (k.precipitation_probability_max && k.precipitation_probability_max[0]!=null) d.weather.text=`Khả năng mưa ${k.precipitation_probability_max[0]}%`;
    d.weather.src=src; changed(true); toast('Đã cập nhật thời tiết'); };
  $('#wFetch').disabled=true;
  try {
    let r=await fetch(`https://api.open-meteo.com/v1/forecast?${q}&start_date=${d.date}&end_date=${d.date}`);
    if (r.ok){ set(await r.json(), 'Dự báo Open-Meteo'); return; }
    const y=parseDate(d.date); const ly=isoDate(new Date(y.getFullYear()-1, y.getMonth(), y.getDate()));
    r=await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${ref.lat}&longitude=${ref.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max&timezone=auto&start_date=${ly}&end_date=${ly}`);
    if (r.ok){ set(await r.json(), 'Chưa có dự báo cho ngày này; đang hiển thị số liệu cùng ngày năm trước để tham khảo'); return; }
    throw new Error(r.status);
  } catch(e){ toast('Không lấy được thời tiết. Kiểm tra kết nối mạng hoặc nhập tay.'); }
  finally { const b=$('#wFetch'); if (b) b.disabled=false; }
}

    zip.file('index.html', html);

    if (await saveBlob(blob, `${slug(TRIP.name)}-ban-xem.zip`, 'application/zip', 'zip')) toast(miss ? 'Đã xuất bản xem. '+MISS_MSG(miss) : 'Đã xuất bản xem. Giải nén rồi mở index.html.', miss?7000:4000);
  } catch(err){ alert('Xuất thất bại: '+err.message); }
  finally { btn.disabled=false; btn.textContent='Xuất bản xem'; }
};

/* ============================================================ MP4 */
let MP4PLAN=null, mp4Cancel=false, mp4Busy=false;
async function detectEnc(W,H,fps){
  if ('VideoEncoder' in window && window.Mp4Muxer){
    for (const [codec,mc] of [['avc1.640034','avc'],['avc1.640033','avc'],['avc1.640028','avc'],['avc1.4d0034','avc'],['avc1.42e034','avc'],['vp09.00.41.08','vp9']]){
      const c={ codec, width:W, height:H, bitrate:8e6, framerate:fps }; if (mc==='avc') c.avc={format:'avc'};
      try { if ((await VideoEncoder.isConfigSupported(c)).supported) return { kind:'wc', cfg:c, mc, ext:'mp4', mime:'video/mp4' }; } catch(e){}
    }
  }
  const rec=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  return rec ? { kind:'rt', rec, ext:rec.startsWith('video/mp4')?'mp4':'webm', mime:rec.split(';')[0] } : null;
}
const vDims = () => { const a=$('#mAspect').value; return a==='16:9'?{W:1920,H:1080}:a==='1:1'?{W:1080,H:1080}:{W:1080,H:1920}; };
async function mp4Refresh(){
  const {W,H}=vDims(); $('#mGo').disabled=true; $('#mInfo').textContent='Đang kiểm tra trình duyệt…';
  MP4PLAN=await detectEnc(W,H,30);
  const P=buildPlayer(selDays(), VPLAN, VSHOW, W, H, MARKS);
  if (!MP4PLAN){ $('#mInfo').textContent='Trình duyệt này không ghi được video. Hãy dùng Chrome hoặc Edge bản mới.'; return; }
  if (!P){ $('#mInfo').textContent='Các ngày đang chọn chưa có điểm đến.'; return; }
  $('#mExt').textContent='.'+MP4PLAN.ext;
  $('#mInfo').textContent=`${MP4PLAN.ext.toUpperCase()} ${W}×${H}, khoảng ${Math.round(P.duration)} giây, kiểu hiện “${$('#vShow [aria-pressed=true]').textContent}”.`+('showSaveFilePicker' in window?'':' File sẽ vào thư mục Tải về.');
  $('#mGo').textContent='showSaveFilePicker' in window ? 'Chọn nơi lưu & xuất' : 'Xuất & tải về'; $('#mGo').disabled=false;
}
$('#vMp4').onclick=()=>{ if (mp4Busy) return; stopPlay(); $('#mName').value=slug(TRIP.name); $('#mProg').hidden=true; $('#mCancel').textContent='Hủy'; $('#mp4Dlg').showModal(); mp4Refresh(); };
$('#mAspect').onchange=mp4Refresh;
$('#mCancel').onclick=()=>{ if (mp4Busy){ mp4Cancel=true; return; } $('#mp4Dlg').close(); };
$('#mp4Dlg').addEventListener('cancel', e=>{ if (mp4Busy){ e.preventDefault(); mp4Cancel=true; } });
$('#mGo').onclick=async()=>{
  const plan=MP4PLAN; if (!plan) return; const {W,H}=vDims(); const name=(slug($('#mName').value)||'lich-trinh')+'.'+plan.ext;
  let handle=null;
  if ('showSaveFilePicker' in window){ try { handle=await window.showSaveFilePicker({ suggestedName:name, types:[{ description:'Video', accept:{ [plan.mime]:['.'+plan.ext] } }] }); } catch(e){ if (e.name==='AbortError') return; } }
  const P=buildPlayer(selDays(), VPLAN, VSHOW, W, H, MARKS); if (!P) return;
  mp4Busy=true; mp4Cancel=false; $('#mGo').disabled=true; $('#mProg').hidden=false; $('#mCancel').textContent='Dừng';
  const ids=[...new Set(selDays().flatMap(d=>d.stops.flatMap(s=>s.imgs||[])))];
  await Promise.all(ids.map(id=>new Promise(res=>{ const im=imgObj(id); if (im.complete) res(); else { im.addEventListener('load',res,{once:true}); im.addEventListener('error',res,{once:true}); } })));
  const prog=(f,txt)=>{ $('#mBar').style.width=(f*100).toFixed(1)+'%'; $('#mStat').textContent=txt; };
  const skipped=VSHOW==='name' ? 0 : [...new Set(selDays().flatMap(d=>d.stops.map(s=>(s.imgs||[])[0]).filter(Boolean)))].filter(id=>!imgSafe(id)).length;
  MP4_RENDER=true;
  try {
    const u=Math.min(W,H)/520, fps=30, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
    let blob=null;
    if (plan.kind==='wc'){
      const mux=new Mp4Muxer.Muxer({ target:new Mp4Muxer.ArrayBufferTarget(), video:{ codec:plan.mc, width:W, height:H, frameRate:fps }, fastStart:'in-memory' });
      let err=null; const enc=new VideoEncoder({ output:(ch,meta)=>mux.addVideoChunk(ch,meta), error:e=>err=e }); enc.configure(plan.cfg);
      const total=Math.ceil(P.duration*fps);
      for (let i=0;i<total;i++){
        if (mp4Cancel){ enc.close(); break; } if (err) throw err;
        P.render(c, W, H, i/fps, u); const vf=new VideoFrame(cv,{ timestamp:Math.round(i*1e6/fps), duration:Math.round(1e6/fps) }); enc.encode(vf,{ keyFrame:i%60===0 }); vf.close();
        while (enc.encodeQueueSize>6) await sleep(2);
        if (i%4===0){ prog((i+1)/total, `Khung ${i+1}/${total}`); await sleep(0); }
      }
      if (!mp4Cancel){ await enc.flush(); enc.close(); mux.finalize(); blob=new Blob([mux.target.buffer],{type:'video/mp4'}); }
    } else {
      const st=cv.captureStream(fps), rec=new MediaRecorder(st,{ mimeType:plan.rec, videoBitsPerSecond:8e6 }), ch=[]; rec.ondataavailable=e=>{ if (e.data.size) ch.push(e.data); };
      const done=new Promise(r=>rec.onstop=r); rec.start(250); const t0=performance.now();
      await new Promise(res=>{ const step=()=>{ const t=(performance.now()-t0)/1000; if (mp4Cancel||t>P.duration){ res(); return; } P.render(c,W,H,t,u); prog(t/P.duration, `${t.toFixed(1)} / ${P.duration.toFixed(1)} giây`); requestAnimationFrame(step); }; step(); });
      rec.stop(); await done; if (!mp4Cancel) blob=new Blob(ch,{type:plan.mime});
    }
    if (blob){ prog(1,'Đang lưu…'); if (handle){ const w=await handle.createWritable(); await w.write(blob); await w.close(); } else download(blob, name); toast(skipped ? 'Đã lưu video. '+MISS_MSG(skipped) : 'Đã lưu video', skipped?7000:2400); }
  } catch(e){ console.error(e); alert('Xuất video thất bại: '+e.message); }
  finally { mp4Busy=false; MP4_RENDER=false; $('#mp4Dlg').close(); }
};

/* ============================================================ PDF (print) */
function staticMap(day, W=1100, H=560){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const r=routeOf(day,'sunny'), rr=routeOf(day,'rainy'); const pts=day.stops; const v=fitView(pts, W, H, 0.14, 4); const pr=makeProj(v.c, v.s, W, H); const u=1.6;
  const areas=new Map(); pts.forEach(s=>{ const a=areaOf(s); if (a) areas.set(a,1); });
  drawBase(c, pr, W, H, u, areas); const col=dayColor(day);
  rr.forEach((s,i)=>{ if (i && !(r.includes(s)&&r.includes(rr[i-1]))) strokeRoute(c, routePts(rr[i-1], s, pr, v.c, s.leg?.mode||'other'), s.leg?.mode||'other', '#8a98a3', u, 0.9); });
  r.forEach((s,i)=>{ if (i) strokeRoute(c, routePts(r[i-1], s, pr, v.c, s.leg?.mode||'other'), s.leg?.mode||'other', col, u); });
  drawPins(c, pr, v.c, pts.map((s,i)=>({ s, num:i+1, color:col, filled:true, dashed:s.plan==='rainy', label:s.name })), u);
  return cv.toDataURL('image/png');
}
function printTrip(marks){
  let h=`<div class="p-cover"><h1>${esc(TRIP.name||'Lịch trình')}</h1><div class="meta">${fmtDayLong(TRIP.start)} – ${fmtDayLong(TRIP.end)} · ${TRIP.days.length} ngày${TRIP.people.length?' · '+TRIP.people.map(esc).join(', '):''}</div></div>`;
  if (TRIP.bookings.length) h+=`<div class="p-sec"><h2>Đặt chỗ</h2><table class="p-tbl"><tr><th>Hạng mục</th><th>Tình trạng</th><th style="text-align:right">Số tiền</th></tr>${TRIP.bookings.map(b=>`<tr><td>${esc(b.item)}${b.note?`<br><span style="color:#777;white-space:pre-wrap">${esc(b.note)}</span>`:''}</td><td>${(BOOK_STATES[b.state]||BOOK_STATES.pending)[1]}</td><td style="text-align:right">${b.cost!=null?fmtMoney(b.cost,b.cur,b.cost2):''}</td></tr>`).join('')}</table></div>`;
  if (TRIP.notes) h+=`<div class="p-sec"><h2>Lưu ý chung</h2><div class="rich">${sanitize(TRIP.notes)}</div></div>`;
  const days = MODE_VIEW||!$('#viewer').hidden ? selDays() : TRIP.days;
  days.forEach(d=>{
    const di=TRIP.days.indexOf(d);
    h+=`<section class="p-day"><h2>Ngày ${di+1} · ${fmtDayLong(d.date)}</h2><div class="w">${esc(weatherText(d.weather))}</div>`;
    if (d.notes.length) h+=`<ul class="p-notes">${d.notes.map(n=>`<li><span class="lvl ${n.level}"></span><div class="rich">${sanitize(n.html)}</div></li>`).join('')}</ul>`;
    if (d.stops.length && ATLAS) h+=`<img class="p-map" src="${staticMap(d)}" alt="">`;
    d.stops.forEach((s,i)=>{ if (marks && marks.get(s.id)==='del') return; const lg=legOf(d,s), m=lg&&s.leg?(MODES[s.leg.mode]||MODES.other):null;
      h+=`<div class="p-stop"><div class="tm">${esc(timeLabel(s,d))}<small>${durLabel(s)}</small></div>
        <div class="nm"><b>${i+1}. ${esc(s.name||'(Chưa đặt tên)')}</b>${s.plan!=='all'?`<span class="p-plan">${PLANS[s.plan]}</span>`:''}${s.act?`<div>${esc(s.act)}</div>`:''}${s.note?`<div style="color:#777">${esc(s.note)}</div>`:''}</div>
        <div class="c">${s.cost!=null?fmtMoney(s.cost,s.cur,s.cost2):''}</div>
        ${m?`<div class="p-leg">${m.icon} ${m.label}${s.leg.min?' · '+fmtDur(s.leg.min):''}${s.leg.cost!=null?' · '+fmtMoney(s.leg.cost,s.leg.cur,s.leg.cost2):''}${s.leg.note?' · '+esc(s.leg.note):''}</div>`:''}</div>`; });
    const c=dayCost(d,'sunny',marks); if (c.all.size) h+=`<div class="p-total">Ước tính: ${moneyList(c.all)}${dayHasAlt(d)?' (phương án trời đẹp)':''}</div>`;
    h+='</section>';
  });
  $('#printRoot').innerHTML=h;
  const imgs=$$('#printRoot img'); Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{ i.onload=i.onerror=r; }))).then(()=>window.print());
}
$('#ePdf').onclick=()=>printTrip(null);
$('#vPdf').onclick=()=>printTrip(MARKS);

/* ============================================================ default trip & init */
// The default trip is trip.json beside this page, in the same format as trip.json inside a saved edit (.zip),
// with its photos in the images/ folder. To change the default, replace those files.
const DEFAULT_TRIP_URL = 'trip.json';
async function loadDefaultTrip(){ try { const r=await fetch(DEFAULT_TRIP_URL, { cache:'no-cache' }); if (!r.ok) throw 0; const t=await r.json(); return t && Array.isArray(t.days) ? t : null; } catch(e){ return null; } }
// A page opened straight from disk (file://) may not read files beside it; then offer to pick trip.json by hand.
function noDefaultNotice(){
  const n=$('#eNotice'), local=location.protocol==='file:';
  n.innerHTML=`<p>${local ? 'Trang đang mở thẳng từ file nên trình duyệt chặn việc đọc lịch trình mặc định (trip.json) nằm cạnh trang. Chọn file đó để mở, hoặc mở trang qua máy chủ web (ví dụ chạy <code>python -m http.server</code> trong thư mục này).' : 'Không tìm thấy lịch trình mặc định (trip.json) cạnh trang.'}</p>
    <div class="inline"><button class="btn small primary" type="button">Chọn trip.json</button><button class="btn small ghost" type="button">Để sau</button></div>`;
  const [pick, later]=n.querySelectorAll('button'); pick.onclick=()=>$('#importZip').click(); later.onclick=()=>{ n.hidden=true; };
  n.hidden=false;
}
(async function init(){
  try { ATLAS = buildAtlas(JSON.parse($('#geo-world').textContent)); } catch(e){ console.error(e); }
  const embedded = JSON.parse($('#trip-data').textContent);
  if (embedded){
    TRIP = normalizeTrip(embedded);
    for (const [id,r] of Object.entries(embedded.images||{})) IMAGES.set(id, { file:r.file, thumb:r.thumb });
    initViewer(false);
  } else {
    const [saved, def] = await Promise.all([ IDB.get('current').catch(()=>null), loadDefaultTrip() ]);
    // The browser keeps the last edited trip. A kept copy of an older version of the default trip gives way to the current one.
    const fromOldDefault = t => def && (t.sample ? t.sample!==def.sample : /^Hokkaido mùa (tuyết|đông)$/.test(t.name||''));
    const keep = saved && saved.trip && !fromOldDefault(saved.trip);
    if (keep){ TRIP=normalizeTrip(saved.trip); (saved.images||[]).forEach(([id,r])=>IMAGES.set(id,r)); }
    else if (def) await useTripDoc(def, null);
    else TRIP=emptyTrip();
    initEditor();
    if (!keep && !def) noDefaultNotice();
  }
  // Higher-detail neighbouring coastlines when online; the inlined 110m map is the offline fallback.
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(r=>r.ok?r.json():null).then(w=>{ if (!w) return; ATLAS=buildAtlas(w); areaCache.clear(); eMap&&eMap.draw(); vMap&&vMap.draw(); }).catch(()=>{});
  document.fonts && document.fonts.load('600 12px "Be Vietnam Pro"').then(()=>{ eMap&&eMap.draw(); vMap&&vMap.draw(); });
})();
